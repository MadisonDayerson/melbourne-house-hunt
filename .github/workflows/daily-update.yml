name: Daily listings update

on:
  schedule:
    - cron: "0 17 * * *"   # 17:00 UTC = 4am Melbourne in summer (3am in winter)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # to commit the updated site

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Agency review pages and Consumer Affairs stories already read on earlier days
      - uses: actions/cache@v4
        with:
          path: data/cache/agencies
          key: agencies-${{ github.run_id }}
          restore-keys: agencies-

      - name: Update listings and rebuild the site
        run: ./scripts/daily_update.sh

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/*.json
          if git diff --cached --quiet; then echo "No changes today"; exit 0; fi
          git commit -m "Daily listings update $(TZ=Australia/Melbourne date +%Y-%m-%d)"
          git push

